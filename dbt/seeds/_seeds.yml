version: 2

# Seeds are small CSVs kept in the repo that `dbt seed` (or `dbt build`) loads as tables.
# Good for hand-maintained lookup data like these overrides.
seeds:
  - name: franchise_main_entry_overrides
    description: >
      Hand-picked main entry for franchises where the automatic rule (earliest significant series) picks the
      wrong face, usually because Shikimori groups a related-but-different series into the franchise.
    config:
      column_types: {franchise_id: string, main_anilist_id: int64, reason: string}
    columns:
      - name: franchise_id
        tests: [unique, not_null]
      - name: main_anilist_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_anime')
                field: anilist_id

  - name: game_clues
    description: >
      The clue columns of each guessing mode, in display order. Keys match dim_game_items.clues. `compare` says how
      check_guess grades a guess: exact (same value), set (all / some / no overlap, e.g. genres) or number (higher /
      lower arrow; "close" when within close_within, a fraction of the answer when close_is_relative).
      Every clue is also a hint the player can reveal at turns 5 and 10.
    config:
      column_types: {mode: string, clue_key: string, label: string, compare: string, close_within: float64,
                     close_is_relative: bool, sort_order: int64}
    columns:
      - name: mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [franchise, anime, character]
      - name: clue_key
        tests: [not_null]
      - name: compare
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exact, set, number]
