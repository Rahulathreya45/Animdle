version: 2

models:
  - name: dim_game_items
    description: >
      The guess pool: one row per (mode, item) for franchise, anime (hard mode) and character, with every clue value
      in `clues` (JSON, keys = seeds/game_clues.csv). Supabase check_guess compares two items' clues using the seed.
    columns:
      - name: mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [franchise, anime, character]
      - name: item_id
        tests: [not_null]
      - name: name
        tests:
          - not_null:
              config: {where: "is_game_eligible"}
      - name: image_url
        tests:
          - not_null:
              config: {where: "is_game_eligible"}
      - name: franchise_id
        tests: [not_null]
      - name: clues
        tests: [not_null]

  - name: fct_puzzle_candidates
    description: >
      Answer pool per mode: every game-eligible item with a difficulty tier (1 easy, 2 normal, 3 hard; thresholds in
      dbt_project.yml vars). The daily pool is tiers 1-2; random mode at tier N draws from tiers <= N.
    columns:
      - name: mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [franchise, anime, character]
      - name: answer_id
        tests: [not_null]
      - name: answer_name
        tests: [not_null]
      - name: difficulty_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false

  - name: fct_higher_lower_cards
    description: >
      Higher or Lower cards. anime = individual entries by AniList popularity; character = one per character by
      favourites. Floors in dbt_project.yml vars keep cards recognisable.
    columns:
      - name: kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [anime, character]
      - name: item_id
        tests: [not_null]
      - name: name
        tests: [not_null]
      - name: image_url
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: dim_search_titles
    description: One row per (kind, target, title) for autocomplete across franchises, anime entries and characters.
    columns:
      - name: kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [franchise, anime, character]
      - name: target_id
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: display_name
        tests: [not_null]

  - name: fct_daily_puzzles
    description: >
      One row per (date, mode). Incremental and append-only by date with full_refresh disabled, so a day's answer and
      clues are frozen once built. Scheduled puzzle_days_ahead days in advance.
    columns:
      - name: puzzle_id
        tests: [unique, not_null]
      - name: puzzle_date
        tests: [not_null]
      - name: mode
        tests:
          - accepted_values:
              arguments:
                values: [franchise, anime, character]
      - name: answer_id
        tests: [not_null]
      - name: answer_image_url
        tests: [not_null]
      - name: answer_clues
        description: JSON snapshot of the answer's clue values (dim_game_items.clues) on the day it was built.
        tests: [not_null]
