name: animdle
version: "0.1.0"
config-version: 2

profile: animdle   # dbt Core reads dbt/profiles.yml; the dbt platform ignores it and uses the connection you set up there

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  raw_dataset: animedle_raw   # where warehouse.load writes the raw tables

  # daily puzzle (models/marts/game)
  puzzle_start_date: "2026-10-16"       # day 1 of the schedule; never change once puzzles are published
  puzzle_days_ahead: 14                 # schedule this far ahead; must exceed the gap between prod runs (weekly)
  puzzle_seed: "animdle-v1"             # fixes the shuffled answer order; changing it reshuffles future days only
  puzzle_min_popularity: 10000          # franchise / anime answers must be at least this popular on AniList
  puzzle_min_character_favourites: 1000 # character answers must have at least this many favourites

models:
  animdle:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table   # query-ready tables for the game and analysis
      +schema: marts
